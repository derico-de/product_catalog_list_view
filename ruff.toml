# Odoo idioms that collide with ruff defaults.
line-length = 88

[lint.per-file-ignores]
# The manifest is a bare dict literal, by design.
"__manifest__.py" = ["B018"]
# Odoo discovers submodules through these imports; they are never referenced.
"__init__.py" = ["F401"]
"**/__init__.py" = ["F401"]

[lint.isort]
# OCA import order: odoo before odoo.addons, both after third party.
section-order = [
    "future",
    "standard-library",
    "third-party",
    "odoo",
    "odoo-addons",
    "first-party",
    "local-folder",
]

[lint.isort.sections]
odoo = ["odoo"]
odoo-addons = ["odoo.addons"]
